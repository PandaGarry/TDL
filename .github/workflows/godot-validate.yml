name: Godot 4.7 validation

# Проверка проекта настоящим движком Godot на чистом Linux-раннере:
# импорт, parse-check GDScript, smoke-запуск. См. tools/check_project.sh.

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_ZIP: "Godot_v4.7.2-stable_linux.x86_64.zip"

jobs:
  validate:
    name: Импорт и smoke-тест
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Восстановить Godot из кэша
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/tdl-godot
          key: godot-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Скачать и проверить Godot (официальный релиз)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tdl-godot
          cd ~/.cache/tdl-godot

          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl -fL -o "${GODOT_ZIP}" "${base_url}/${GODOT_ZIP}"
          curl -fL -o SHA512-SUMS.txt "${base_url}/SHA512-SUMS.txt"

          grep " ${GODOT_ZIP}$" SHA512-SUMS.txt > godot.sha512
          sha512sum --check godot.sha512

          unzip -o "${GODOT_ZIP}"
          mv "Godot_v4.7.2-stable_linux.x86_64" godot
          chmod +x godot
          rm -f "${GODOT_ZIP}" SHA512-SUMS.txt godot.sha512

      - name: Версия Godot
        run: ~/.cache/tdl-godot/godot --version

      - name: GDScript style (first-party paths)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tdl-gdtoolkit
          /tmp/tdl-gdtoolkit/bin/pip install --disable-pip-version-check 'gdtoolkit==4.5.0'
          /tmp/tdl-gdtoolkit/bin/gdformat --check scripts tests
          /tmp/tdl-gdtoolkit/bin/gdlint scripts tests

      - name: Проверить проект (импорт + скрипты + smoke)
        shell: bash
        run: bash tools/check_project.sh ~/.cache/tdl-godot/godot

      - name: Снять скриншоты движком Godot 4.7.2 (Xvfb + OpenGL3)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p build/ci-logs
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1080x24" \
            ~/.cache/tdl-godot/godot --audio-driver Dummy --rendering-driver opengl3 \
            --path . --scene "res://tests/smoke/capture_screenshots.tscn" --quit-after 300 \
            2>&1 | tee build/ci-logs/screenshots.log
          if grep -niE 'SCRIPT ERROR|Invalid call|Shader compilation' build/ci-logs/screenshots.log ; then
            grep -niE -A2 'SCRIPT ERROR|Invalid call|Shader compilation' build/ci-logs/screenshots.log | head -10 | while IFS= read -r line; do
              echo "::error title=Screenshot Runtime Error::${line}"
            done
            exit 1
          fi
          ls -la docs/art/godot_captures/
          if [ -n "$(git status --porcelain docs/art/godot_captures)" ]; then
            git config user.name "PandaGarry"
            git config user.email "92579573+PandaGarry@users.noreply.github.com"
            git add docs/art/godot_captures/*.png
            git commit -m "Capture live Godot 4.7.2 engine screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Загрузить логи проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs
          path: build/ci-logs/*.log
          if-no-files-found: warn
          retention-days: 14
