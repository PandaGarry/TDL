name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gdscript:
    name: GDScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: Lint
        run: gdlint src tests

  godot:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Run tests
        run: |
          set +e
          ./godot --headless --path . res://tests/test_runner.tscn 2>&1 | tee test_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Логи GitHub недоступны из песочницы — выносим ошибку в аннотации.
            head -12 test_output.log | while IFS= read -r line; do
              echo "::error title=godot-head::${line//%/%25}"
            done
            tail -12 test_output.log | while IFS= read -r line; do
              echo "::error title=godot-tail::${line//%/%25}"
            done
          fi
          exit "$status"
